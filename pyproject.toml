[project]
name = "EasyGPU"
version = "0.0.0"
description = "A Python WebGPU wrapper with a built-in FakeGPU for TDD without a GPU (preview)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "eagletang", email = "yiguo.tang@outlook.com" }
]
requires-python = ">=3.11"
keywords = ["webgpu", "wgpu", "graphics", "tdd", "testing", "fake"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Software Development :: Testing",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/EagleEatApple/easygpu"
Repository = "https://github.com/EagleEatApple/easygpu"
Issues = "https://github.com/EagleEatApple/easygpu/issues"


[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    "E501",
    "N802",
    "N803",
    "N806",
]

[tool.mypy]
strict = true
files = ["src"]